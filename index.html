<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/img/favicon.ico" type="image/x-icon">
    <title>CSS Mem Slider</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <header class="header">
        <h1>Mem Slider</h1>
    </header>
    <main>
        <div class="wrapper">
            <div class="wrapper-slider">
                <input type="radio" name="element__item" id="radio1" checked>
                <input type="radio" name="element__item" id="radio2">
                <input type="radio" name="element__item" id="radio3">
                <input type="radio" name="element__item" id="radio4">
                <input type="radio" name="element__item" id="radio5">

                <div class="slider__container">
                    <div class="element__item element__item1">
                        <div class="slider__img">
                            <img src="assets/img/img-1.png" alt="elem1">
                        </div>
                    </div>
                    <div class="element__item element__item2">
                        <div class="slider__img">
                            <img src="assets/img/img-2.png" alt="elem2">
                        </div>
                    </div>
                    <div class="element__item element__item3">
                        <div class="slider__img">
                            <img src="assets/img/img-3.png" alt="elem3">
                        </div>
                    </div>
                    <div class="element__item element__item4">
                        <div class="slider__img">
                            <img src="assets/img/img-4.png" alt="elem4">
                        </div>
                    </div>
                    <div class="element__item element__item5">
                        <div class="slider__img">
                            <img src="assets/img/img-5.png" alt="elem5">
                        </div>
                    </div>
                </div>


                <div class="slider__bottom">
                    <div class="navigation">
                        <label for="radio1" class="bar"></label>
                        <label for="radio2" class="bar"></label>
                        <label for="radio3" class="bar"></label>
                        <label for="radio4" class="bar"></label>
                        <label for="radio5" class="bar"></label>
                    </div>

                    <div class="slider__container-article">
                        <p class="slider__article slider__article1 ">Нужно таск задебажить </p>
                        <p class="slider__article slider__article2">Локи как состояние души
                        </p>
                        <p class="slider__article slider__article3">Синдром Ван Гога</p>
                        <p class="slider__article slider__article4">Надо же, популярность набирать
                        </p>
                        <p class="slider__article slider__article5">У какая женщина...</p>
                    </div>

                </div>
            </div>
        </div>
        </div>
    </main>

</body>

</html>
